<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shorty — сервис сокращения ссылок</title>
  <meta name="description" content="Shorty сокращает длинные ссылки в короткие и удобные." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <svg class="ribbon" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
      <path class="ribbon-path" d="M-40 520 C 180 380, 320 640, 520 480 S 860 280, 1100 420 S 1280 620, 1400 500" />
      <path class="ribbon-path soft" d="M-60 300 C 200 180, 380 420, 600 260 S 900 120, 1240 240" />
    </svg>
  </div>

  <main class="stage">
    <header class="brand-block">
      <p class="brand">Shorty</p>
      <h1 class="headline">Вставьте вашу ссылку</h1>
      <p class="lede">Сократим её за секунду — получите короткую ссылку, которой удобно делиться.</p>
    </header>

    <form class="shorten-form" id="shorten-form" novalidate>
      <label class="field">
        <span class="field-label">Длинный URL</span>
        <input
          id="original-url"
          name="original_url"
          type="url"
          inputmode="url"
          autocomplete="url"
          placeholder="https://example.com/очень/длинный/путь"
          required
        />
      </label>

      <div class="form-row">
        <label class="field field-ttl">
          <span class="field-label">Срок жизни</span>
          <select id="expires-in" name="expires_in">
            <option value="">Без срока</option>
            <option value="3600">1 час</option>
            <option value="86400">1 день</option>
            <option value="604800">7 дней</option>
            <option value="2592000">30 дней</option>
          </select>
        </label>

        <button type="submit" class="btn-primary" id="submit-btn">
          <span class="btn-text">Сократить</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </div>

      <p class="form-error" id="form-error" hidden></p>
    </form>

    <section class="result" id="result" hidden aria-live="polite">
      <p class="result-label">Готово — ваша короткая ссылка</p>
      <div class="result-row">
        <a class="result-link" id="result-link" href="#" target="_blank" rel="noopener noreferrer"></a>
        <button type="button" class="btn-copy" id="copy-btn">Копировать</button>
      </div>
      <p class="result-meta" id="result-meta"></p>
    </section>
  </main>

  <script src="/static/js/app.js" defer></script>
</body>
</html>
