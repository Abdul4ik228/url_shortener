services:
  postgres:
    image: postgres:16-alpine
    container_name: url_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: url_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d url_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: url_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: url_shortener_app
    ports:
      - "8000:8000"
    volumes:
      - .:/usr/src/app
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@postgres:5432/url_db
      REDIS_URL: redis://redis:6379/0
      SECRET_SALT: my_super_secret_salt_2026
      BASE_DOMAIN: http://localhost:8000
      REDIS_TTL: 3600
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

volumes:
  postgres_data:
